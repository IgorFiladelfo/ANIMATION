name: 'STP Arcade Pac-Man Contribution Graph'
description: 'Generates the custom STP arcade Pac-Man animation from a GitHub contribution grid.'
author: 'IgorFiladelfo'

runs:
  using: node24
  main: github-action/dist/index.js

inputs:
  github_user_name:
    description: 'GitHub username whose contribution grid will be rendered.'
    required: true
  github_token:
    description: 'GitHub token used to fetch the contribution calendar.'
    required: false
    default: ${{ github.token }}
  games:
    description: 'Kept for compatibility. This custom Action renders pacman only.'
    required: false
    default: 'pacman'
  player_style:
    description: 'Pac-Man player style: opportunistic, conservative, or aggressive.'
    required: false
    default: 'opportunistic'
  hide_month_labels:
    description: 'Hide month labels when true.'
    required: false
    default: 'false'
